<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Your Apps</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; display: flex; flex-direction: column; position: relative; }
    .header { background-color: #0d52bf; color: white; text-align: center; padding: 16px; font-size: 1.25rem; font-weight: bold; }
    .content { flex: 1; padding: 20px 15px; }
    .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px 10px; text-align: center; }
    .app-item { text-decoration: none; color: #333; display: flex; flex-direction: column; align-items: center; }
    .app-icon { width: 68px; height: 68px; border-radius: 18px; object-fit: cover; box-shadow: 0 4px 8px rgba(0,0,0,0.12); margin-bottom: 6px; }
    .app-name { font-size: 0.8rem; font-weight: 600; line-height: 1.2; word-break: break-word; max-width: 75px; text-align: center; }
    .footer { text-align: center; padding: 20px; font-size: 0.85rem; color: #666; border-top: 1px solid #eee; margin-top: auto; }
    .overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.98); z-index: 100; padding: 20px; flex-direction: column; align-items: center; justify-content: center; }
    .auth-box { width: 100%; max-width: 340px; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); border: 1px solid #e1e4e8; }
    .auth-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; text-align: center; color: #0d52bf; }
    .field-group { margin-bottom: 12px; }
    .field-group label { display: block; font-size: 0.8rem; color: #555; margin-bottom: 4px; font-weight: 600; }
    .field-group input, .field-group textarea { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; }
    .btn-submit { width: 100%; padding: 12px; background: #0d52bf; color: white; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: bold; cursor: pointer; }
    .btn-submit:disabled { background: #84a9e8; cursor: not-allowed; }
    .admin-panel { display: none; padding: 20px; }
    .status-msg { margin-top: 10px; font-size: 0.85rem; color: #0d52bf; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">Download Your Apps</div>

    <div class="content" id="storeView">
      <div class="app-grid" id="appGrid"></div>
    </div>

    <div class="overlay" id="portalView">
      <div class="auth-box">
        <div class="auth-title">Portal Verification</div>
        <form id="authForm">
          <div class="field-group">
            <label>ID</label>
            <input type="text" id="i1" required autocomplete="off">
          </div>
          <div class="field-group">
            <label>ACCESS KEY</label>
            <input type="password" id="i2" required>
          </div>
          <button type="submit" class="btn-submit">Verify & Continue</button>
        </form>
      </div>
    </div>

    <div class="admin-panel" id="adminView">
      <h2 style="font-size: 1.1rem; color: #0d52bf; margin-bottom: 15px;">App Assets Uploader</h2>
      <form id="appUploadForm">
        <div class="field-group">
          <label>Package ID (e.g. com.jinx.app)</label>
          <input type="text" id="appId" placeholder="com.example.myapp" required>
        </div>
        <div class="field-group">
          <label>App Name</label>
          <input type="text" id="appName" placeholder="My App" required>
        </div>
        <div class="field-group">
          <label>Attach APK File</label>
          <input type="file" id="apkFile" accept=".apk" required>
        </div>
        <div class="field-group">
          <label>Attach Preview Image</label>
          <input type="file" id="previewFile" accept="image/*" required>
        </div>
        <div class="field-group">
          <label>Description</label>
          <textarea id="appDesc" rows="3" placeholder="Enter app description..." required></textarea>
        </div>
        <button type="submit" id="btnUpload" class="btn-submit">Upload Assets & Deploy</button>
        <div class="status-msg" id="statusMsg"></div>
      </form>
    </div>

    <div class="footer">
      Powered by Khant Zaw Minn Oo
    </div>
  </div>

  <script>
    const _0x1a = "dXBsb2FkZXI=";
    const _0x1b = "RGFicmlhQXBwc0A2OQ==";
    const _0xgh = "R2hwX0JLc1VPZ1hMMnVmZHBUbVFpUFVDVEI3RHZtMmVONFpOOFFTMw==";
    
    const TARGET_REPO = "KhantZawMinnOo/khantzawminnoo.github.io";
    const BASE_PATH = "JinXApps/Assets";

    function getDecryptedToken() {
      return atob(_0xgh);
    }

    async function loadAppGrid() {
      const grid = document.getElementById("appGrid");
      grid.innerHTML = "";

      try {
        const res = await fetch(`https://api.github.com/repos/${TARGET_REPO}/contents/${BASE_PATH}`);
        if (!res.ok) throw new Error("No assets folder found");
        
        const items = await res.json();
        const folders = items.filter(item => item.type === "dir");

        for (const folder of folders) {
          const appId = folder.name;
          try {
            const dataRes = await fetch(`${BASE_PATH}/${appId}/data.json`);
            if (dataRes.ok) {
              const data = await dataRes.json();
              const item = document.createElement("a");
              item.className = "app-item";
              item.href = `details.html?${appId}`;
              item.innerHTML = `
                <img src="${data.previewPath}" class="app-icon" alt="${data.name}" onerror="this.src='https://via.placeholder.com/68'">
                <span class="app-name">${data.name}</span>
              `;
              grid.appendChild(item);
            }
          } catch (e) {}
        }
      } catch (err) {
        console.error(err);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadAppGrid();
      if (window.location.search.includes("upload")) {
        document.getElementById("storeView").style.display = "none";
        document.getElementById("portalView").style.display = "flex";
      }
    });

    document.getElementById("authForm").addEventListener("submit", (e) => {
      e.preventDefault();
      if (btoa(document.getElementById("i1").value.trim()) === _0x1a && 
          btoa(document.getElementById("i2").value.trim()) === _0x1b) {
        document.getElementById("portalView").style.display = "none";
        document.getElementById("adminView").style.display = "block";
      } else {
        alert("Access Denied!");
      }
    });

    const fileToBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });

    async function uploadToGitHubRepo(path, contentBase64, message) {
      const url = `https://api.github.com/repos/${TARGET_REPO}/contents/${path}`;
      const response = await fetch(url, {
        method: "PUT",
        headers: {
          "Authorization": `token ${getDecryptedToken()}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: message,
          content: contentBase64
        })
      });
      return response.json();
    }

    document.getElementById("appUploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const status = document.getElementById("statusMsg");
      const btn = document.getElementById("btnUpload");
      
      const appId = document.getElementById("appId").value.trim().toLowerCase();
      const appName = document.getElementById("appName").value.trim();
      const appDesc = document.getElementById("appDesc").value.trim();
      
      const apkFile = document.getElementById("apkFile").files[0];
      const previewFile = document.getElementById("previewFile").files[0];

      try {
        btn.disabled = true;
        status.innerText = "Processing files...";

        const apkBase64 = await fileToBase64(apkFile);
        const previewBase64 = await fileToBase64(previewFile);
        const previewExt = previewFile.name.split('.').pop();

        const apkPath = `${BASE_PATH}/${appId}/app.apk`;
        const previewPath = `${BASE_PATH}/${appId}/preview.${previewExt}`;
        const jsonPath = `${BASE_PATH}/${appId}/data.json`;

        const jsonContent = JSON.stringify({
          id: appId,
          name: appName,
          description: appDesc,
          apkPath: apkPath,
          previewPath: previewPath,
          updatedAt: new Date().toISOString()
        }, null, 2);
        
        const jsonBase64 = btoa(unescape(encodeURIComponent(jsonContent)));

        status.innerText = "Uploading APK to Assets...";
        await uploadToGitHubRepo(apkPath, apkBase64, `Add APK for ${appId}`);

        status.innerText = "Uploading Preview Image...";
        await uploadToGitHubRepo(previewPath, previewBase64, `Add Preview for ${appId}`);

        status.innerText = "Generating data.json...";
        await uploadToGitHubRepo(jsonPath, jsonBase64, `Add JSON for ${appId}`);

        status.innerText = "Upload Completed Successfully!";
        alert(`Assets created at ${BASE_PATH}/${appId}/ successfully!`);
        location.href = "index.html";

      } catch (err) {
        status.innerText = "Upload failed!";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
