<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Details</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background-color: #0d52bf; color: white; text-align: center; padding: 16px; font-size: 1.25rem; font-weight: bold; text-transform: uppercase; }
    .content { padding: 15px; flex: 1; }
    .banner-box { width: 100%; height: 210px; border-radius: 12px; overflow: hidden; background: #eee; margin-bottom: 15px; }
    .banner-img { width: 100%; height: 100%; object-fit: cover; }
    .desc-card { background: #fafafa; border: 1px solid #e8e8e8; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
    .desc-title { font-size: 1.05rem; font-weight: bold; margin-bottom: 10px; color: #222; }
    .desc-text { font-size: 0.9rem; color: #444; line-height: 1.5; white-space: pre-line; }
    .btn-download { display: block; width: 100%; background: #0d52bf; color: white; text-align: center; padding: 14px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; text-decoration: none; }
    .btn-download:active { background: #0a3d8f; }
    .footer { text-align: center; padding: 20px; font-size: 0.85rem; color: #666; border-top: 1px solid #eee; margin-top: auto; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header" id="pageTitle">APP DETAILS</div>

    <div class="content">
      <div class="banner-box">
        <img id="appPreview" class="banner-img" src="" alt="Preview">
      </div>

      <div class="desc-card">
        <div class="desc-title" id="appName">Loading...</div>
        <div class="desc-text" id="appDesc">Loading details...</div>
      </div>

      <a id="btnDownload" href="#" class="btn-download" download>Download</a>
    </div>

    <div class="footer">
      Powered by Khant Zaw Minn Oo
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      const appId = window.location.search.replace("?", "").trim().toLowerCase();

      if (!appId) {
        document.getElementById("appName").innerText = "No App ID Specified";
        return;
      }

      try {
        const res = await fetch(`Assets/${appId}/data.json`);
        if (!res.ok) throw new Error("Assets not found");
        
        const data = await res.json();

        document.getElementById("pageTitle").innerText = data.name;
        document.getElementById("appName").innerText = data.name;
        document.getElementById("appDesc").innerText = data.description;
        document.getElementById("appPreview").src = data.previewPath;
        document.getElementById("btnDownload").href = data.apkPath;

      } catch (err) {
        document.getElementById("appName").innerText = "App Not Found";
        document.getElementById("appDesc").innerText = "Could not load assets for package ID: " + appId;
      }
    });
  </script>
</body>
</html>
