<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Details</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; padding: 0; }
    .container { width: 100%; max-width: 480px; background: #fff; min-height: 100vh; display: flex; flex-direction: column; }

    /* Top Bar */
    .header { background-color: #0d52bf; color: white; text-align: center; padding: 16px; font-size: 1.25rem; font-weight: bold; text-transform: uppercase; }

    .content { padding: 15px; flex: 1; }

    /* Banner Image */
    .banner-box { width: 100%; height: 210px; border-radius: 12px; overflow: hidden; background: #eee; margin-bottom: 15px; }
    .banner-img { width: 100%; height: 100%; object-fit: cover; }

    /* Meta Info Card */
    .info-card { background: #fafafa; border: 1px solid #e8e8e8; border-radius: 10px; padding: 12px 15px; display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
    .app-icon { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; }
    .app-title { font-size: 1.15rem; font-weight: bold; color: #111; margin-bottom: 4px; }
    .app-sub { font-size: 0.85rem; color: #666; }

    /* Description Card */
    .desc-card { background: #fafafa; border: 1px solid #e8e8e8; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
    .desc-title { font-size: 1.05rem; font-weight: bold; margin-bottom: 10px; color: #222; }
    .desc-text { font-size: 0.9rem; color: #444; line-height: 1.5; white-space: pre-line; }

    /* Download Button */
    .btn-download { display: block; width: 100%; background: #0d52bf; color: white; text-align: center; padding: 14px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; text-decoration: none; box-shadow: 0 4px 10px rgba(13, 82, 191, 0.3); }
    .btn-download:active { background: #0a3d8f; }

    /* Footer */
    .footer { text-align: center; padding: 20px; font-size: 0.85rem; color: #666; border-top: 1px solid #eee; margin-top: auto; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header" id="pageTitle">APP DETAILS</div>

    <div class="content">
      <!-- Preview Banner -->
      <div class="banner-box">
        <img id="appBanner" class="banner-img" src="" alt="Preview">
      </div>

      <!-- Icon & Meta -->
      <div class="info-card">
        <img id="appIcon" class="app-icon" src="" alt="Icon">
        <div>
          <div class="app-title" id="appName">Loading...</div>
          <div class="app-sub">Version: <span id="appVer">-</span> &nbsp; Size: <span id="appSize">-</span></div>
        </div>
      </div>

      <!-- Description -->
      <div class="desc-card">
        <div class="desc-title">Description</div>
        <div class="desc-text" id="appDesc">Loading description...</div>
      </div>

      <!-- Download Direct Link -->
      <a id="btnDownload" href="#" class="btn-download" download>Download</a>
    </div>

    <div class="footer">
      Powered by Khant Zaw Minn-Oo
    </div>
  </div>

  <script>
    // Default Mock Database for fallback
    const mockDetails = {
      "pubg": {
        name: "PUBG Mobile",
        version: "1.7.0",
        size: "800 MB",
        icon: "https://play-lh.googleusercontent.com/JRd051-P81CCh3z_v352A90AXA8I-9mS-C8T84T-_2j4iLqf5y",
        banner: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80",
        download: "https://github.com/username/repo/releases/download/v1.0/pubg.apk",
        desc: "Join the battle in PUBG Mobile, the ultimate battle royale game! Fight to survive, loot weapons, and defeat your enemies to be the last one standing.\n\nEnjoy stunning graphics and intense action in this thrilling game!"
      }
    };

    window.addEventListener("DOMContentLoaded", () => {
      // Get App ID from URL query string (e.g. details.html?pubg)
      const query = window.location.search.replace("?", "").trim().toLowerCase();
      
      const storedDB = JSON.parse(localStorage.getItem("dabria_apps_db") || "[]");
      let app = storedDB.find(a => a.id === query);

      if (!app && mockDetails[query]) {
        app = mockDetails[query];
      }

      if (app) {
        document.getElementById("pageTitle").innerText = app.name;
        document.getElementById("appName").innerText = app.name;
        document.getElementById("appVer").innerText = app.version || "1.0.0";
        document.getElementById("appSize").innerText = app.size || "Unknown";
        document.getElementById("appIcon").src = app.icon;
        document.getElementById("appBanner").src = app.banner || app.icon;
        document.getElementById("appDesc").innerText = app.desc || "No description provided.";
        document.getElementById("btnDownload").href = app.download || "#";
      } else {
        document.getElementById("appName").innerText = "App Not Found";
        document.getElementById("appDesc").innerText = "Please check the app link again.";
      }
    });
  </script>
</body>
</html>
